<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- vibrant iOS-style gradient (matches the Glass page avatar) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb1"/>
      <stop offset="0.55" stop-color="#b78cff"/>
      <stop offset="1" stop-color="#7aa8ff"/>
    </linearGradient>
    <!-- top glossy sheen -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="4" y="4" width="56" height="56" rx="15"/>
    </clipPath>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.9" flood-color="#3a2a55" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- base squircle -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#bg)"/>

  <!-- frosted glass sheen across the top -->
  <g clip-path="url(#squircle)">
    <ellipse cx="32" cy="4" rx="44" ry="24" fill="url(#gloss)"/>
    <rect x="4" y="34" width="56" height="26" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- glass edge highlight -->
  <rect x="4.9" y="4.9" width="54.2" height="54.2" rx="14.1" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.6"/>

  <!-- monogram -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="29" font-weight="700" letter-spacing="-1" fill="#ffffff" filter="url(#textShadow)">JV</text>
</svg>
